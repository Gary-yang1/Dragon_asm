server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $asm_backend api:8080;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/ {
    proxy_pass http://$asm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location = /readyz { proxy_pass http://$asm_backend/readyz; }
  location /assets/ { try_files $uri =404; expires 7d; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
