        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created notification rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/notification-rules/{id}/enabled:
    patch:
      tags: [notifications]
      summary: Enable or disable a notification rule.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Update marker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/reports/dashboard:
    get:
      tags: [reports]
      summary: Get dashboard summary.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Dashboard data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/reports/trends:
    get:
      tags: [reports]
      summary: Get trend series.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Trend series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/reports/top:
    get:
      tags: [reports]
      summary: Get top-N report.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: dimension
          in: query
          schema: { type: string, default: asset }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Top-N data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/reports/remediation:
    get:
      tags: [reports]
      summary: Get remediation summary.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Remediation data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/reports/exports:
    get:
      tags: [reports]
      summary: List report export jobs.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Export jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
    post:
      tags: [reports]
      summary: Create an async report export.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Export job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/reports/exports/{id}:
    get:
      tags: [reports]
      summary: Get export job detail.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Export job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericEnvelope"
  /projects/{project_id}/reports/exports/{id}/download:
    get:
      tags: [reports]
      summary: Download a completed export file.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Export file stream.
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/json: { schema: { type: string, format: binary } }
  /projects/{project_id}/discovery/runs/{run_id}/derived-targets:
    get:
      tags: [discovery]
      summary: Classify discovered targets under the run's current parent authorization.
      description: Requires discovery:read, asset:read and scope:read. Returns up to 100 materialized asset observations per cursor page. This read does not grant authorization or dispatch work.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
        - name: after_id
          in: query
          schema: { type: integer, format: uint64, minimum: 0, default: 0 }
      responses:
        '200':
          description: Current parent authorization and classified targets. Counts are per page, not project totals.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GenericEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DerivedTargetPage' }
        '403': { description: A required project permission is missing. }
        '404': { description: The source run or its parent scope is unavailable in this project. }
  /projects/{project_id}/discovery/runs/{run_id}/continuations:
    post:
      tags: [discovery]
      summary: Create or reuse an immutable continuation template from authorized evidence.
      description: |
        Requires discovery:run, asset:read, scope:read and an active project. All selected
        observations must belong to the source run and be covered by its current scope.
        Targets are derived on the server; arbitrary submitted target values are not accepted.
        Repeated identical selections reuse the template. Does not create a run or call an engine.
        Source evidence and scope are checked again when creating a run and before dispatch.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DerivedSelection'
                - type: object
                  required: [task_type]
                  properties:
                    task_type: { type: string, enum: [dns, passive_intel, port_probe, web_probe, fingerprint] }
      responses:
        '200': { description: Created or reused TaskTemplate, with config.inheritance provenance., content: { application/json: { schema: { $ref: '#/components/schemas/GenericEnvelope' } } } }
        '403': { description: A required project permission is missing. }
        '409': { description: Parent scope changed, source/evidence unavailable, or selected targets are not authorized. }
        '422': { description: Invalid selection, incompatible target type, or execution policy rejects this task. }
  /projects/{project_id}/discovery/runs/{run_id}/derived-targets/authorize:
    post:
      tags: [discovery]
      summary: Explicitly authorize a reviewed batch of previously uncovered targets.
      description: |
        Requires scope:write, scope:read, discovery:read, asset:read and an active project.
        Append exact-match includes to the source run's parent scope. Does not alter its expiry,
        status or exclusions. Excluded/dangerous targets cannot be admitted. The entire batch is
        transactional; a scope fingerprint conflict requires refresh. Audit includes the operator,
        reason, source run, observation IDs and before/after scope. Does not dispatch work.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DerivedSelection'
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Updated parent Scope with targets., content: { application/json: { schema: { $ref: '#/components/schemas/GenericEnvelope' } } } }
        '403': { description: Explicit scope management permission is required. }
        '409': { description: DISCOVERY_PARENT_SCOPE_CHANGED or DISCOVERY_INHERITANCE_NOT_READY. }
        '422': { description: Invalid or oversized batch. No partial authorization is persisted. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    ProjectIDQuery:
      name: project_id
      in: query
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    ScopeID:
      name: scope_id
      in: path
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    BlueprintKey:
      name: blueprint_key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{2,63}$"
    TemplateID:
      name: template_id
      in: path
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    PageNumber:
      name: page_number
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortOrder:
      name: sort_order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
  responses:
    BadRequest:
      description: The request body or parameters are malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication failed or missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The principal cannot access the requested tenant or project scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: State conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested project-scoped resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: The request is well-formed but violates discovery validation rules.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Discovery queue, callback configuration, or engine is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    GenericEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id: { type: string }
        data: {}
    ErrorEnvelope:
      type: object
      required: [request_id, error]
      properties:
        request_id: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    EngineCredentialSummary:
      type: object
      additionalProperties: false
      required: [key, label, configured, masked_value]
      description: A credential-presence indicator. The original credential is never exposed.
      properties:
        key: { type: string, maxLength: 64 }
        label: { type: string, maxLength: 128 }
        configured: { type: boolean }
        masked_value:
          type: string
          maxLength: 128
          description: Masked display value, or an empty string when the credential is not configured. This field never contains the original Token, AK, SK, email, or provider key.
    EngineProviderSummary:
      type: object
      additionalProperties: false
      required: [key, name, configured, credentials]
      properties:
        key: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        configured: { type: boolean }
        credentials:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/EngineCredentialSummary"
    EngineNodeSummary:
      type: object
      additionalProperties: false
      required: [node_id, capabilities]
      properties:
        node_id: { type: string, maxLength: 128 }
        capabilities:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 64 }
    ManagedEngineSummary:
      type: object
      additionalProperties: false
      required: [route, key, name, configured, ready, health, base_url, capabilities, credentials]
      properties:
        configuration_version: { type: integer, minimum: 0 }
        route: { type: string, enum: [passive, active] }
        key: { type: string }
        name: { type: string }
        instance_id:
          type: string
          maxLength: 128
          description: Optional engine-reported instance identifier.
        configured: { type: boolean }
        ready: { type: boolean }
        health: { type: string, enum: [healthy, degraded, unreachable, unconfigured, unknown] }
        base_url:
          type: string
          description: Sanitized configured endpoint URL. User information, query strings, and fragments are rejected by the service.
        capabilities:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 64 }
        credentials:
          type: array
          description: Masked local engine credentials only; original values are never returned.
          items:
            $ref: "#/components/schemas/EngineCredentialSummary"
        providers:
          type: array
          maxItems: 32
          description: Optional passive-intelligence providers, including masked FOFA credential status.
          items:
            $ref: "#/components/schemas/EngineProviderSummary"
        nodes:
          type: array
          description: Optional online active-engine execution nodes.
          items:
            $ref: "#/components/schemas/EngineNodeSummary"
        last_checked_at: { type: string, format: date-time }
        latency_ms: { type: integer, format: int64, minimum: 0 }
        error_summary:
          type: string
          description: Sanitized operator-facing failure summary without response bodies or credentials.
        project_mapping_count:
          type: integer
          minimum: 1
          description: Number of configured ASM-project to active-engine-project mappings. Omitted when zero.
    ActiveDispatchPolicy:
      type: object
      additionalProperties: false
      required: [enabled, require_approval, require_ownership]
      properties:
        enabled: { type: boolean }
        require_approval: { type: boolean }
        require_ownership: { type: boolean }
    EngineWorkerSummary:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [online, stale, unknown] }
        last_seen_at: { type: string, format: date-time }
        config_matches:
          type: boolean
          description: When present, compares only engine routes, project mappings, active policy, and whether credentials are configured. It does not compare or expose credential contents.
    EngineManagementOverview:
      type: object
      additionalProperties: false
      required: [items, active_policy, worker]
      properties:
        configuration_version: { type: integer, minimum: 0 }
        editable: { type: boolean }
        items:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ManagedEngineSummary"
        active_policy:
          $ref: "#/components/schemas/ActiveDispatchPolicy"
        worker:
          $ref: "#/components/schemas/EngineWorkerSummary"
    EngineConfigurationEnvelope:
      type: object
      properties:
        request_id: { type: string }
        data:
          type: object
          required: [version, values, secrets, providers_managed]
          properties:
            version: { type: integer, minimum: 1 }
            values: { type: object, additionalProperties: { type: string } }
            secrets: { type: object, additionalProperties: { $ref: "#/components/schemas/EngineCredentialSummary" } }
            providers_managed: { type: boolean }
            provider_error: { type: string }
    EngineManagementOverviewEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EngineManagementOverview"
    ManagedEngineSummaryEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ManagedEngineSummary"
    ScopeTargetRequest:
      type: object
      additionalProperties: false
      required: [target_type, match_mode, value]
      properties:
        url_rule:
          $ref: '#/components/schemas/URLAuthorizationRule'
        target_type: { type: string, enum: [domain, ip, cidr, url, company] }
        match_mode: { type: string, enum: [include, exclude] }
        coverage_mode:
          type: string
          enum: [exact, subdomains]
          default: exact
          description: subdomains is valid only for domain targets and includes the root domain itself.
        value:
          type: string
          minLength: 1
          maxLength: 512
          description: URL rules support a leading *. hostname shortcut. Structured URL rules authorize the whole site; path/query restrictions are unsupported. Legacy URL targets without url_rule retain their original origin comparison.
    URLAuthorizationRule:
      type: object
      description: Whole-site authorization. For a matching hostname family, explicit URL grants take precedence over broad domain/IP grants. Exclusions always win. Multiple URL grants form a union.
      required: [protocol, include_root, include_subdomains, ports]
      properties:
        protocol: { type: string, enum: [http, https, both] }
        include_root: { type: boolean, description: Include the anchor hostname itself. }
        include_subdomains: { type: boolean, description: Include all descendant hostnames, never sibling or suffix-lookalike domains. }
        ports:
          type: array
          maxItems: 20
          description: Empty means HTTP port 80 and HTTPS port 443. Explicit ports apply to every selected protocol.
          items: { type: integer, minimum: 1, maximum: 65535 }
    ScopeCreateRequest:
      type: object
      additionalProperties: false
      required: [name, authorized_by, valid_from, valid_until, targets]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [active, inactive], default: inactive }
        is_default:
          type: boolean
          default: false
          description: Only an active Scope can be the project default; assigning it clears the previous default atomically.
        authorized_by: { type: string, minLength: 1, maxLength: 64 }
        valid_from: { type: string, format: date-time }
        valid_until:
          type: string
          format: date-time
          description: Must be later than valid_from and no more than 365 days after it.
        targets:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ScopeTargetRequest" }
    BlueprintPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        scope_id:
          type: integer
          format: uint64
          minimum: 1
          description: Optional explicit Scope. Omit to use the project default or only compatible active Scope.
    BlueprintStepDefaults:
      type: object
      required: [timeout_seconds, rate_limit, concurrency, retry_limit]
      properties:
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400 }
        rate_limit: { type: integer, minimum: 1, maximum: 10000 }
        concurrency: { type: integer, minimum: 1, maximum: 500 }
        retry_limit: { type: integer, minimum: 0, maximum: 100 }
    DiscoveryBlueprintStep:
      type: object
      required: [key, name, description, task_type, engine_route, required_target_types, depends_on, defaults]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        task_type:
          type: string
          enum: [passive_intel, dns, org_intel, port_probe, web_probe, fingerprint]
        engine_route: { type: string, enum: [passive, active] }
        required_target_types:
          type: array
          items: { type: string, enum: [domain, ip, cidr, url, company] }
        depends_on:
          type: array
          items: { type: string }
        defaults: { $ref: "#/components/schemas/BlueprintStepDefaults" }
    DiscoveryBlueprint:
      type: object
      required: [key, version, name, description, category, risk_level, required_target_types, steps]
      properties:
        key: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        risk_level: { type: string, enum: [passive, active, mixed] }
        required_target_types:
          type: array
          items: { type: string, enum: [domain, ip, cidr, url, company] }
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DiscoveryBlueprintStep" }
    BlueprintPreviewIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - PROJECT_NOT_ACTIVE
            - SCOPE_INACTIVE
            - SCOPE_NOT_STARTED
            - SCOPE_EXPIRED
            - TARGET_TYPE_MISSING
            - ENGINE_NOT_CONFIGURED
            - ACTIVE_DISCOVERY_NOT_ENABLED
            - DEPENDENCY_NOT_READY
        message: { type: string }
        step_key: { type: string }
    BlueprintScopeSummary:
      type: object
      required: [id, name, status, valid_from, valid_until, target_types]
      properties:
        id: { type: integer, format: uint64, minimum: 1 }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        target_types:
          type: array
          items: { type: string, enum: [domain, ip, cidr, url, company] }
    BlueprintStepPreview:
      type: object
      required: [step, ready, issues]
      properties:
        target_count: { type: integer, description: Concrete URL count after applying authorization to existing project assets. }
        batch_count: { type: integer, minimum: 1, description: Number of automatic batches after applying both the 1000-target engine limit and the 64 KiB template JSON limit. }
        target_examples:
          type: array
          maxItems: 3
          items: { type: string }
        targets_truncated: { type: boolean, deprecated: true, description: Legacy truncation indicator. Current previews enumerate all matching assets with keyset pagination and split them into complete batches. }
        step: { $ref: "#/components/schemas/DiscoveryBlueprintStep" }
        ready: { type: boolean }
        issues:
          type: array
          items: { $ref: "#/components/schemas/BlueprintPreviewIssue" }
    BlueprintPreview:
      type: object
      required: [execution_mode, blueprint, project_status, scope_selection, scope, ready, issues, steps, notice]
      properties:
        execution_mode: { type: string, enum: [preview_only] }
        blueprint: { $ref: "#/components/schemas/DiscoveryBlueprint" }
        project_status: { type: string, enum: [draft, active, suspended, archived] }
        scope_selection:
          type: string
          enum: [explicit, project_default, only_compatible]
          description: Explains how the preview Scope was resolved.
        scope: { $ref: "#/components/schemas/BlueprintScopeSummary" }
        ready:
          type: boolean
          description: Local prerequisites are satisfied; no workflow or scan has been created.
        issues:
          type: array
          items: { $ref: "#/components/schemas/BlueprintPreviewIssue" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/BlueprintStepPreview" }
        notice: { type: string }
    DiscoveryBlueprintPageEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id: { type: string }
        data:
          type: object
          required: [items, total, page_size, page_number]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/DiscoveryBlueprint" }
            total: { type: integer, format: int64, minimum: 0 }
            page_size: { type: integer, minimum: 1, maximum: 100 }
            page_number: { type: integer, minimum: 1 }
    BlueprintPreviewEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id: { type: string }
        data: { $ref: "#/components/schemas/BlueprintPreview" }
    BlueprintMaterializedTemplate:
      type: object
      required: [id, project_id, scope_id, name, task_type, config, schedule, enabled, timeout_seconds, rate_limit, concurrency, retry_limit]
      properties:
        id: { type: integer, format: uint64, minimum: 1 }
        project_id: { type: integer, format: uint64, minimum: 1 }
        scope_id: { type: integer, format: uint64, minimum: 1 }
        name: { type: string }
        task_type: { type: string }
        config: { type: object, additionalProperties: true }
        schedule: { type: string }
        enabled: { type: boolean }
        timeout_seconds: { type: integer }
        rate_limit: { type: integer }
        concurrency: { type: integer }
        retry_limit: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
    BlueprintTemplateResult:
      type: object
      required: [step_key, batch_index, batch_count, target_count, created, template]
      properties:
        step_key: { type: string }
        batch_index: { type: integer, minimum: 1 }
        batch_count: { type: integer, minimum: 1 }
        target_count: { type: integer, minimum: 1 }
        created: { type: boolean }
        template: { $ref: "#/components/schemas/BlueprintMaterializedTemplate" }
    BlueprintTemplateMaterialization:
      type: object
      required: [execution_mode, blueprint_key, version, scope_id, created_count, existing_count, target_count, templates, notice]
      properties:
        execution_mode: { type: string, enum: [templates_only] }
        blueprint_key: { type: string }
        version: { type: string }
        scope_id: { type: integer, format: uint64, minimum: 1 }
        created_count: { type: integer, minimum: 0 }
        existing_count: { type: integer, minimum: 0 }
