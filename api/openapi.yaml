        created_by: { type: string }
        updated_by: { type: string }
    AssetEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Asset"
    AssetPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Asset"
                total: { type: integer }
                page_size: { type: integer }
                page_number: { type: integer }
    AssetSummary:
      type: object
      required: [inventory, by_type, freshness, governance]
      properties:
        inventory:
          type: object
          required: [total, managed_total, active, inactive, ignored]
          properties:
            total: { type: integer }
            managed_total: { type: integer, description: Non-ignored assets. }
            active: { type: integer }
            inactive: { type: integer }
            ignored: { type: integer }
        by_type:
          type: object
          properties:
            domain: { type: integer }
            subdomain: { type: integer }
            ip: { type: integer }
            port: { type: integer }
            service: { type: integer }
            web: { type: integer }
            certificate: { type: integer }
            cloud_resource: { type: integer }
            third_party: { type: integer }
        freshness:
          type: object
          properties:
            new_24h: { type: integer, description: Counted by first_seen. }
            observed_24h: { type: integer, description: Counted by last_seen. }
            stale_30d: { type: integer, description: last_seen older than 30 days. }
        governance:
          type: object
          properties:
            unowned: { type: integer }
            unassigned_business_unit: { type: integer }
            low_confidence: { type: integer }
            low_confidence_below: { type: integer, minimum: 0, maximum: 100 }
    AssetSummaryEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AssetSummary"
    AssetGraphNode:
      type: object
      properties:
        id: { type: integer, format: uint64 }
        asset_type: { type: string }
        display_name: { type: string }
        value: { type: string }
        status: { type: string }
        source: { type: string }
        owner: { type: string }
        business_unit: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        last_seen: { type: string, format: date-time }
        focus: { type: boolean }
    AssetGraphEdge:
      type: object
      properties:
        id: { type: integer, format: uint64 }
        from_asset_id: { type: integer, format: uint64 }
        to_asset_id: { type: integer, format: uint64 }
        relation_type: { type: string, enum: [contains, resolves_to, redirects_to, cert_binding, references] }
        source: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        last_seen: { type: string, format: date-time }
    AssetGraph:
      type: object
      required: [nodes, edges, truncated]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/AssetGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/AssetGraphEdge"
        truncated: { type: boolean }
    AssetGraphEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AssetGraph"
    AssetImportRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [asset_type, value]
            properties:
              asset_type: { type: string }
              value: { type: string }
              display_name: { type: string }
              source: { type: string }
              owner: { type: string }
              business_unit: { type: string }
              confidence: { type: integer, minimum: 0, maximum: 100 }
              status: { type: string }
    AssetUpdateRequest:
      type: object
      properties:
        display_name: { type: string }
        source: { type: string }
        owner: { type: string }
        business_unit: { type: string }
        status: { type: string }

    DerivedSelection:
      type: object
      required: [observation_ids, scope_fingerprint]
      properties:
        observation_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, format: uint64, minimum: 1 }
        scope_fingerprint:
          type: string
          minLength: 64
          maxLength: 64
          description: Opaque SHA-256 fingerprint returned by the current derived-targets preview.
    DerivedTarget:
      type: object
      required: [observation_id, target_type, value, status, reason, provider, observed_at, evidence_hash]
      properties:
        observation_id: { type: integer, format: uint64 }
        target_type: { type: string, enum: [domain, ip, url] }
        value: { type: string }
        status: { type: string, enum: [inherited, pending, excluded, blocked] }
        reason: { type: string }
        provider: { type: string }
        observed_at: { type: string, format: date-time }
        evidence_hash: { type: string, minLength: 64, maxLength: 64 }
    DerivedTargetPage:
      type: object
      required: [source_run_id, parent_scope_id, parent_scope_name, scope_fingerprint, valid_until, parent_active, source_complete, items, next_cursor]
      properties:
        source_run_id: { type: integer, format: uint64 }
        parent_scope_id: { type: integer, format: uint64 }
        parent_scope_name: { type: string }
        scope_fingerprint: { type: string }
        valid_until: { type: string, format: date-time }
        parent_active: { type: boolean }
        source_complete: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/DerivedTarget' }
        next_cursor: { type: integer, format: uint64, description: Zero means the last page. }
    TargetInheritance:
      type: object
      description: Server-generated immutable target provenance stored at config.inheritance. Never forwarded to an external engine. Template JSON is bounded to 65536 bytes.
      required: [source_run_id, parent_scope_id, parent_fingerprint, evidence]
      properties:
        source_run_id: { type: integer, format: uint64 }
        parent_scope_id: { type: integer, format: uint64 }
        parent_fingerprint: { type: string }
        evidence:
          type: array
          maxItems: 100
          items:
            type: object
            required: [observation_id, hash, observed_at]
            properties:
              observation_id: { type: integer, format: uint64 }
              hash: { type: string }
              observed_at: { type: string, format: date-time }
