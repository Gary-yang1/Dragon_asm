  /projects/{project_id}/discovery/blueprints:
    get:
      tags: [discovery]
      summary: List built-in ASM discovery scenario blueprints.
      description: Returns a versioned, read-only catalog. No templates or runs are created.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { description: Paged discovery blueprints., content: { application/json: { schema: { $ref: "#/components/schemas/DiscoveryBlueprintPageEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{project_id}/discovery/blueprints/{blueprint_key}/preview:
    post:
      tags: [discovery]
      summary: Preview one discovery scenario against a project scope.
      description: |
        Performs local prerequisite checks only: project state, authorization
        window, include target types, engine route configuration, and the active
        discovery release switch. It does not call an engine, create templates,
        or dispatch a scan. When scope_id is omitted, the service selects a
        compatible project default Scope, or the only compatible active Scope.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/BlueprintKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintPreviewRequest" } } }
      responses:
        "200": { description: Read-only scenario preview., content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintPreviewEnvelope" } } } }
        "400": { description: Malformed preview request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Multiple compatible scopes require an explicit selection., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { description: No active compatible scope is available., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /projects/{project_id}/discovery/blueprints/{blueprint_key}/templates:
    post:
      tags: [discovery]
      summary: Materialize a ready discovery scenario as manual task templates.
      description: |
        Re-evaluates the preview and creates one enabled, unscheduled task
        template per scenario step in a single transaction. Repeated requests
        reuse templates carrying the same blueprint version, step and Scope.
        This operation never creates a TaskRun, calls an engine, or starts a scan.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/BlueprintKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintPreviewRequest" } } }
      responses:
        "200": { description: Created or reused scenario task templates., content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintTemplateMaterializationEnvelope" } } } }
        "400": { description: Malformed request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Preview is not ready or a generated name conflicts., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
