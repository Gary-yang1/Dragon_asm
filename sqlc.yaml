version: "2"
sql:
  - engine: "mysql"
    queries: "./internal/platform/db/query/"
    schema: "./internal/platform/db/schema/"
    gen:
      go:
        package: "dbgen"
        out: "./internal/platform/db/generated"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        # MySQL JSON columns default to json.RawMessage, which database/sql cannot
        # scan a NULL into ("unsupported Scan, storing driver.Value type <nil>").
        # Every nullable JSON column therefore made its whole list endpoint 500 as
        # soon as one row left it empty — a port exposure with no certificate SANs
        # took out the exposure page, an unscored risk took out the risk page.
        # []byte is what database/sql handles natively (NULL becomes nil), and it
        # is assignable to json.RawMessage in both directions, so callers are
        # unaffected.
        overrides:
          - db_type: "json"
            go_type:
              type: "byte"
              slice: true
          # The nullable variant resolves separately, and it is the one that was
          # actually breaking.
          - db_type: "json"
            nullable: true
            go_type:
              type: "byte"
              slice: true
